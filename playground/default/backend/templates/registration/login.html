<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in — dynamic_user playground</title></head>
<body style="font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 24rem;">
  <h1>Sign in</h1>
  {% if form.errors %}<p style="color: crimson;">Invalid username or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>Username<br>{{ form.username }}</label></p>
    <p><label>Password<br>{{ form.password }}</label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
