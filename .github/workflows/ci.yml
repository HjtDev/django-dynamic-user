# Thin caller — all real logic lives in the org-level reusable workflow (docs/APP-DESIGN.md
# §10.1, §10.2). Never add job logic here; add an input to app-package-ci.yml instead.
#
# Ref pinning: @main, matching ../appkit's and ../cleanup_app's own callers — HjtDev/.github has
# no tags yet, so @v1 does not exist. Once a v1 tag is cut there, migrate every caller (including
# this one) to it — from that point a bad push to the shared repo's main would otherwise break
# every app's CI simultaneously with no staging step.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# The repo's default GITHUB_TOKEN permissions are read-only. app-package-ci.yml's publish-npm
# job requests id-token: write (for OIDC trusted publishing) — a reusable workflow's job can only
# downscope from what the CALLER grants, never escalate past it, so without this block the
# workflow_call fails validation before any job runs at all (a zero-job "startup_failure").
permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: HjtDev/.github/.github/workflows/app-package-ci.yml@main
    with:
      package-name: dynamic_user
      coverage-threshold: 85
      extras: "celery avatar"
      postgres-db: test_dynamic_user
      # tests/backend/settings.py declares no CACHES key at all -> Django's LocMemCache. A Redis
      # service container here would just be unused overhead.
      needs-redis: false
      # This repo is an npm workspace root (root package.json declares workspaces: ["frontend",
      # "playground/default/frontend", "playground/subclassed/frontend"]) — the only
      # package-lock.json lives at the repo root, not in frontend/. Without this, `npm ci
      # --working-directory frontend` fails outright (no lockfile there).
      npm-workspace-root: "."
      forbid-runtime-dependencies: true
      # Asserted against the built wheel — a MANIFEST.in/package-data gap here would silently
      # ship an app whose type hints or fa translations never actually land in a host's install.
      # templates/ and static/ deliberately excluded: both directories exist but hold only a
      # .gitkeep (no Jazzmin template override was ever added — admin.py configures Jazzmin
      # through settings, not template overrides), so asserting a real path under either would
      # fail; the .gitkeep placeholders ship regardless, this just isn't a meaningful gate on them.
      wheel-must-contain: |
        dynamic_user/py.typed
        dynamic_user/locale/fa/LC_MESSAGES/django.mo
      # Publishes frontend/ to the npm registry as @hjtdev/django-dynamic-user on a v* tag push,
      # via OIDC trusted publishing — no NPM_TOKEN anywhere. One-time bootstrap required before
      # this does anything for real: see CHANGELOG.md's v1.0.0 entry / the release runbook.
      publish-npm: true
    secrets: inherit

  # PyPI publish lives HERE, in the caller, not in app-package-ci.yml — the one sanctioned
  # exception to "never add job logic here" (CLAUDE.md; docs/APP-DESIGN.md §10.1). PyPI's own
  # docs state plainly that a reusable workflow cannot be the workflow in a Trusted Publisher:
  # the OIDC token's `job_workflow_ref` claim for a `workflow_call` job resolves to the CALLEE
  # (HjtDev/.github/.github/workflows/app-package-ci.yml@…), never this file, so PyPI would
  # reject every mint-token request with invalid-publisher if this job lived in the reusable
  # workflow instead. npm has the opposite rule — it validates the CALLING workflow's name for
  # workflow_call — which is why publish-npm correctly stays in app-package-ci.yml. Do not "fix"
  # this asymmetry by moving one to match the other; both placements are already correct for
  # their own registry.
  #
  # Registered on pypi.org as project django-dynamic-user, publisher repo
  # HjtDev/django-dynamic-user, workflow ci.yml, environment publish-pypi — every field below
  # must keep matching that configuration.
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    runs-on: ubuntu-latest
    environment: publish-pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv build
        working-directory: backend
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist
          # Mirrors publish-npm's "already published — skipping" branch: the release that
          # bootstraps trusted publishing on a NEW PyPI project can still hit a re-run of this
          # exact tag, and failing on "file already exists" instead of skipping would turn a
          # recoverable re-run into a stuck release.
          skip-existing: true
