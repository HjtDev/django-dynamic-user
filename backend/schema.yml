      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfile'
          description: ''
  /api/v1/users/me/setting/:
    get:
      operationId: users_me_setting_retrieve
      description: SETTING_EDITABLE_FIELDS + SETTING_READ_FIELDS (union).
      summary: Get my setting
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSetting'
          description: ''
    patch:
      operationId: users_me_setting_partial_update
      description: SETTING_EDITABLE_FIELDS, applied via SettingService.update.
      summary: Update my setting
      tags:
      - dynamic-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeSettingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeSettingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeSettingUpdateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSetting'
          description: ''
  /api/v1/users/profiles/:
    get:
      operationId: users_profiles_list
      description: Paginated, cached list of every profile with is_public=True. PROFILE_PUBLIC_FIELDS
        plus a nested user block from USER_PUBLIC_FIELDS.
      summary: List public profiles
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProfileList'
          description: ''
  /api/v1/users/profiles/{id}/:
    get:
      operationId: users_profiles_retrieve
      description: PROFILE_PUBLIC_FIELDS plus a nested user block from USER_PUBLIC_FIELDS,
        for one profile. {id} is the target user's id, not the Profile row's own pk.
        404 (not 403) when the profile is private and the requester isn't the owner.
      summary: Retrieve a public profile
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
          description: ''
components:
  schemas:
    ActionFlagEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - Addition
        * `2` - Change
        * `3` - Deletion
    AdminChangeLogEntry:
      type: object
      description: |-
        v1.1.0. ``ChangeLogEntry`` (this app's own audit-log model, concrete/not swappable — see
        ``models.py``'s docstring), entirely read-only — ``GET /change-log/``,
        ``GET /change-log/{id}/``.
      properties:
        id:
          type: integer
          readOnly: true
        content_type:
          type: integer
          readOnly: true
        object_id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
          description: The user who made this change, if known.
        field_name:
          type: string
          readOnly: true
        old_value:
          type: string
          readOnly: true
        new_value:
          type: string
          readOnly: true
        changed_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - changed_at
      - content_type
      - field_name
      - id
      - new_value
      - object_id
      - old_value
    AdminDeletionRequest:
      type: object
      description: |-
        ``GET /deletion-requests/``, and the response body of the review/finalize actions —
        entirely read-only. Unlike the self-service :class:`DeletionRequestSerializer`, this one
        includes ``user`` and ``reviewed_by`` — an admin reviewing a queue of everyone's requests
        needs to know whose request it is and who already reviewed it; a self-service caller already
        knows both (or, for ``reviewed_by``, was never meant to see it, per this package's own
        rules).
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
          description: Optional reason provided by the user.
        requested_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        finalize_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - finalize_at
      - id
      - reason
      - requested_at
      - reviewed_at
      - reviewed_by
      - status
      - user
    AdminDeletionRequestCreateRequest:
      type: object
      properties:
        user:
          type: integer
        reason:
          type: string
          default: ''
      required:
      - user
    AdminGroup:
      type: object
      description: |-
        v1.1.0. Read-only — ``GET /groups/``, ``GET /groups/{id}/``, so a dashboard can populate
        the picker behind ``PATCH /{id}/``'s ``groups`` field. ``Group``/``Permission`` are Django's
        own ``django.contrib.auth`` models, never swappable, always installed (this whole package
        already depends on ``django.contrib.auth`` — this is not a new dependency).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        permissions:
          type: array
          items:
            type: integer
          readOnly: true
      required:
      - id
      - name
      - permissions
    AdminLogEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action_time:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
        content_type:
          type: integer
          readOnly: true
          nullable: true
        object_id:
          type: string
          readOnly: true
          nullable: true
        object_repr:
          type: string
          readOnly: true
        action_flag:
          allOf:
          - $ref: '#/components/schemas/ActionFlagEnum'
          readOnly: true
        change_message:
          type: string
          readOnly: true
      required:
      - action_flag
      - action_time
      - change_message
      - content_type
      - id
      - object_id
      - object_repr
      - user
    AdminPermission:
      type: object
      description: |-
        v1.1.0. Read-only — ``GET /permissions/``, so a dashboard can populate the picker behind
        ``PATCH /{id}/``'s ``user_permissions`` field.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        codename:
          type: string
          readOnly: true
        content_type:
          type: integer
          readOnly: true
      required:
      - codename
      - content_type
      - id
      - name
    AdminProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        bio:
          type: string
        is_public:
          type: boolean
          title: Public
          description: Whether this profile is visible to other users.
      required:
      - id
      - user
    AdminProfileCreateRequest:
      type: object
      properties:
        user:
          type: integer
        bio:
          type: string
        is_public:
          type: boolean
          title: Public
          description: Whether this profile is visible to other users.
      required:
      - user
    AdminSetPasswordRequest:
      type: object
      description: |-
        v1.1.0. ``POST /{id}/set-password/``'s request body — the only field a caller may supply.
        Not a ``ModelSerializer``: the actual write goes through
        :meth:`~dynamic_user.services.UserService.set_password`, which runs
        ``AUTH_PASSWORD_VALIDATORS`` itself; this serializer only proves a ``password`` string was
        given at all.
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    AdminSetting:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        language:
          type: string
          maxLength: 10
        timezone:
          type: string
          maxLength: 64
        notifications_enabled:
          type: boolean
          description: Whether this user receives notifications.
      required:
      - id
      - user
    AdminSettingCreateRequest:
      type: object
      properties:
        user:
          type: integer
        language:
          type: string
          minLength: 1
          maxLength: 10
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        notifications_enabled:
          type: boolean
          description: Whether this user receives notifications.
      required:
      - user
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          nullable: true
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          nullable: true
          title: Phone number
          maxLength: 32
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
      required:
      - date_joined
      - id
    AdminUserCreateRequest:
      type: object
      properties:
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          nullable: true
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          nullable: true
          title: Phone number
          maxLength: 32
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
    DeletionRequest:
      type: object
      description: |-
        ``GET``/``POST`` responses on ``/me/deletion-request/`` — entirely read-only.

        Deliberately excludes ``user`` (redundant — the caller already knows who they are) and
        ``reviewed_by`` — never expose ``reviewed_by`` on any user-facing serializer, per this
        package's own rules and the Phase 5 guide.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
          description: Optional reason provided by the user.
        requested_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finalize_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - finalize_at
      - id
      - reason
      - requested_at
      - reviewed_at
      - status
    DeletionRequestCreateRequest:
      type: object
      description: |-
        ``POST /me/deletion-request/``'s request body — the only field a caller may supply.

        ``AccountDeletionRequest`` isn't swappable (``docs/CONTRACT.md`` §1), and this shape isn't a
        settings-driven allowlist surface, so it's hand-written with an explicit field list rather
        than routed through :func:`build_serializer` — exactly the case this module's own docstring
        and the Phase 5 guide call out.
      properties:
        reason:
          type: string
          description: Optional reason provided by the user.
    DeletionReviewRequest:
      type: object
      description: |-
        ``POST /deletion-requests/{id}/review/``'s request body — the only field a caller may
        supply. Not a ``ModelSerializer``: ``approved`` isn't itself a model field, it's the input to
        ``DeletionService.review()``'s ``approved`` kwarg.
      properties:
        approved:
          type: boolean
      required:
      - approved
    MeProfile:
      type: object
      properties:
        bio:
          type: string
          readOnly: true
        is_public:
          type: boolean
          readOnly: true
          title: Public
          description: Whether this profile is visible to other users.
        id:
          type: integer
          readOnly: true
      required:
      - bio
      - id
      - is_public
    MeSetting:
      type: object
      properties:
        language:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        notifications_enabled:
          type: boolean
          readOnly: true
          description: Whether this user receives notifications.
        id:
          type: integer
          readOnly: true
      required:
      - id
      - language
      - notifications_enabled
      - timezone
    MeUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Email address
        phone:
          type: string
          readOnly: true
          nullable: true
          title: Phone number
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - is_active
      - name
      - phone
      - username
    PaginatedAdminChangeLogEntryList:
