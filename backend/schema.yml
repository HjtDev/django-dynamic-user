openapi: 3.0.3
info:
  title: django-dynamic-user
  version: 0.0.0
paths:
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: Paginated, filterable list of every user. USER_READ_FIELDS-shaped
        full fields except password. Beyond page/page_size, any concrete, non-relation
        field on the resolved user model is accepted as an exact-match query filter
        (?field=value) — see _filterable_user_fields(). That set is host-dependent
        (a subclassed User model adds its own fields), so it cannot be enumerated
        as fixed OpenAPI parameters here; the frontend SDK's AdminUsersParams type
        is intentionally open-ended for the same reason.
      summary: List users (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: admin_users_create
      description: v1.1.0. Any user field, plus an optional write-only password (unset
        -> set_unusable_password()). 403 (whole request rejected) if a non-superuser's
        body touches is_staff/is_superuser/is_active/groups/user_permissions — the
        same CanEscalatePrivilege gate PATCH /{id}/ already uses.
      summary: Create a user (admin)
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: Every real field except password.
      summary: Retrieve a user (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: Any user field except password. 403 (whole request rejected) if
        a non-superuser's body touches is_staff/is_superuser/is_active/groups/user_permissions.
      summary: Update a user (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    delete:
      operationId: admin_users_destroy
      description: 'v1.1.0. Hard-deletes the user outright, bypassing the account-deletion
        review flow entirely. Superuser-only, always, regardless of ADMIN_REQUIRES_SUPERUSER
        — the same floor as POST /deletion-requests/{id}/finalize/, for the same reason:
        irreversible, and a compromised staff account should never reach it.'
      summary: Delete a user (admin, superuser-only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/{id}/profile/:
    get:
      operationId: admin_users_profile_retrieve
      description: Every real field on the resolved Profile model.
      summary: Retrieve a user's profile (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
    patch:
      operationId: admin_users_profile_partial_update
      description: Any Profile field, applied via ProfileService.update.
      summary: Update a user's profile (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
  /api/v1/admin/users/{id}/set-password/:
    post:
      operationId: admin_users_set_password_create
      description: Runs AUTH_PASSWORD_VALIDATORS; sends user_password_set.
      summary: Set a user's password (admin, superuser-only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminSetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminSetPasswordRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/{id}/setting/:
    get:
      operationId: admin_users_setting_retrieve
      description: Every real field on the resolved Setting model.
      summary: Retrieve a user's setting (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
          description: ''
    patch:
      operationId: admin_users_setting_partial_update
      description: Any Setting field, applied via SettingService.update.
      summary: Update a user's setting (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
          description: ''
  /api/v1/admin/users/change-log/:
    get:
      operationId: admin_users_change_log_list
      description: v1.1.0. Paginated, filterable list of ChangeLogEntry rows — HistoryMixin's
        own audit trail, previously readable only through Django Admin's ChangeLogEntryAdmin.
      summary: List change-log entries (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminChangeLogEntryList'
          description: ''
  /api/v1/admin/users/change-log/{id}/:
    get:
      operationId: admin_users_change_log_retrieve
      description: |-
        v1.1.0. ``GET``/``DELETE`` ``/change-log/{id}/``. No ``PATCH`` — a change-log row is
        write-once, by design (``mixins.HistoryMixin.log_change``), on both interfaces.
      summary: Retrieve a change-log entry (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChangeLogEntry'
          description: ''
    delete:
      operationId: admin_users_change_log_destroy
      description: v1.1.0. Superuser-only, always — an audit row deleted by anything
        less is exactly the tampering an audit trail exists to make visible. Matches
        the tightened ChangeLogEntryAdmin gate (docs/CONTRACT.md §10).
      summary: Delete a change-log entry (admin, superuser-only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/deletion-requests/:
    get:
      operationId: admin_users_deletion_requests_list
      description: Paginated, filterable by status.
      summary: List account-deletion requests (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - finalized
          - pending
          - rejected
        description: Filter by status.
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminDeletionRequestList'
          description: ''
    post:
      operationId: admin_users_deletion_requests_create
      description: v1.1.0. {user, reason}. 409 if the user already has a pending or
        approved request.
      summary: Create an account-deletion request (admin)
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDeletionRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminDeletionRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDeletionRequestCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeletionRequest'
          description: ''
  /api/v1/admin/users/deletion-requests/{id}/:
    get:
      operationId: admin_users_deletion_requests_retrieve
      description: v1.1.0. Backs the frontend SDK's previously-unpopulated deletionRequest(id)
        key.
      summary: Retrieve an account-deletion request (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeletionRequest'
          description: ''
    delete:
      operationId: admin_users_deletion_requests_destroy
      description: v1.1.0. DeletionService.cancel_by_id — a PENDING or APPROVED request
        only. 409 if already REJECTED/FINALIZED.
      summary: Cancel an account-deletion request (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/deletion-requests/{id}/finalize/:
    post:
      operationId: admin_users_deletion_requests_finalize_create
      description: Bypasses finalize_at. Irreversible. 409 if the request isn't currently
        APPROVED.
      summary: Finalize an account-deletion request early (admin, superuser-only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/deletion-requests/{id}/review/:
    post:
      operationId: admin_users_deletion_requests_review_create
      description: Moves a PENDING request to APPROVED or REJECTED. 409 if not PENDING.
      summary: Review an account-deletion request (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionReviewRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeletionRequest'
          description: ''
  /api/v1/admin/users/groups/:
    get:
      operationId: admin_users_groups_list
      description: v1.1.0. Read-only — populates the picker behind PATCH /{id}/'s
        groups field. Full Group CRUD stays django.contrib.auth's own admin surface.
      summary: List groups (admin, read-only)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminGroupList'
          description: ''
  /api/v1/admin/users/groups/{id}/:
    get:
      operationId: admin_users_groups_retrieve
      description: v1.1.0. ``GET /groups/{id}/``.
      summary: Retrieve a group (admin, read-only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroup'
          description: ''
  /api/v1/admin/users/log-entries/:
    get:
      operationId: admin_users_log_entries_list
      description: v1.1.0. Django's own django.contrib.admin.models.LogEntry — every
        write made through Django Admin is auto-logged here already; this is the read
        side for a custom dashboard. Only registered when django.contrib.admin is
        installed.
      summary: List Django admin-action log entries (admin, read-only)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminLogEntryList'
          description: ''
  /api/v1/admin/users/log-entries/{id}/:
    get:
      operationId: admin_users_log_entries_retrieve
      description: |-
        v1.1.0. ``GET``/``DELETE`` ``/log-entries/{id}/``. ``DELETE`` is superuser-only,
        always, matching the equally-tightened ``LogEntryAdmin.has_delete_permission`` —
        deleting an audit row is exactly the tampering an audit trail exists to make visible.
      summary: Retrieve a Django admin-action log entry (admin, read-only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLogEntry'
          description: ''
    delete:
      operationId: admin_users_log_entries_destroy
      description: |-
        v1.1.0. ``GET``/``DELETE`` ``/log-entries/{id}/``. ``DELETE`` is superuser-only,
        always, matching the equally-tightened ``LogEntryAdmin.has_delete_permission`` —
        deleting an audit row is exactly the tampering an audit trail exists to make visible.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/permissions/:
    get:
      operationId: admin_users_permissions_list
      description: v1.1.0. Read-only — populates the picker behind PATCH /{id}/'s
        user_permissions field.
      summary: List permissions (admin, read-only)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPermissionList'
          description: ''
  /api/v1/admin/users/profiles/:
    get:
      operationId: admin_users_profiles_list
      description: v1.1.0. Paginated, filterable collection over every Profile row
        — unlike GET /profiles/ on the self-service surface, not restricted to is_public=True.
        Any concrete, non-relation field on the resolved Profile model is accepted
        as an exact-match query filter, the same _filterable_model_fields() reasoning
        as the user list.
      summary: List profiles (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminProfileList'
          description: ''
    post:
      operationId: admin_users_profiles_create
      description: v1.1.0. Any Profile field, including user (writable here only).
      summary: Create a profile (admin)
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProfileCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminProfileCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminProfileCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
  /api/v1/admin/users/profiles/{profile_id}/:
    get:
      operationId: admin_users_profiles_retrieve
      description: v1.1.0. Keyed by the Profile row's own pk, not the owning user's
        id.
      summary: Retrieve a profile (admin)
      parameters:
      - in: path
        name: profile_id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
    patch:
      operationId: admin_users_profiles_partial_update
      description: v1.1.0. Any Profile field, applied via ProfileService.update.
      summary: Update a profile (admin)
      parameters:
      - in: path
        name: profile_id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
    delete:
      operationId: admin_users_profiles_destroy
      description: v1.1.0. Deletes the row outright — Django Admin can already do
        this.
      summary: Delete a profile (admin)
      parameters:
      - in: path
        name: profile_id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/settings/:
    get:
      operationId: admin_users_settings_list
      description: v1.1.0. Same shape as GET /profiles/ (admin collection), for Setting.
      summary: List settings (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminSettingList'
          description: ''
    post:
      operationId: admin_users_settings_create
      description: v1.1.0. Any Setting field, including user (writable here only).
      summary: Create a setting (admin)
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminSettingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminSettingCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
          description: ''
  /api/v1/admin/users/settings/{setting_id}/:
    get:
      operationId: admin_users_settings_retrieve
      description: v1.1.0. Keyed by the Setting row's own pk, not the owning user's
        id.
      summary: Retrieve a setting (admin)
      parameters:
      - in: path
        name: setting_id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
          description: ''
    patch:
      operationId: admin_users_settings_partial_update
      description: v1.1.0. Any Setting field, applied via SettingService.update.
      summary: Update a setting (admin)
      parameters:
      - in: path
        name: setting_id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
          description: ''
    delete:
      operationId: admin_users_settings_destroy
      description: v1.1.0. Deletes the row outright — Django Admin can already do
        this.
      summary: Delete a setting (admin)
      parameters:
      - in: path
        name: setting_id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      description: USER_READ_FIELDS, entirely read-only — includes locked fields for
        visibility, none of them writable from here or anywhere else on this surface.
      summary: Get my account info
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeUser'
          description: ''
    patch:
      operationId: users_me_partial_update
      description: v1.1.0. USER_SELF_EDITABLE_FIELDS minus USER_LOCKED_FIELDS, applied
        via UserService.update — deliberately name-only by default; see get_user_self_editable_serializer()'s
        own docstring for why.
      summary: Update my account info
      tags:
      - dynamic-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUserUpdateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeUser'
          description: ''
  /api/v1/users/me/deletion-request/:
    get:
      operationId: users_me_deletion_request_retrieve
      description: The caller's active (pending or approved) request, or 404 if none
        exists.
      summary: Get my current deletion request
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
          description: ''
    post:
      operationId: users_me_deletion_request_create
      description: Starts the grace-period countdown. 409 (not 500) if a request is
        already pending or approved, rather than creating a duplicate.
      summary: Request account deletion
      tags:
      - dynamic-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionRequestCreateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
          description: ''
    delete:
      operationId: users_me_deletion_request_destroy
      description: 409 (not 500) if the caller's request isn't currently pending.
      summary: Cancel my deletion request
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/me/profile/:
    get:
      operationId: users_me_profile_retrieve
