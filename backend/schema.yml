        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminProfile'
    PaginatedAdminSettingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminSetting'
    PaginatedAdminUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    PaginatedPublicProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicProfile'
    PatchedAdminProfileRequest:
      type: object
      properties:
        bio:
          type: string
        is_public:
          type: boolean
          title: Public
          description: Whether this profile is visible to other users.
    PatchedAdminSettingRequest:
      type: object
      properties:
        language:
          type: string
          minLength: 1
          maxLength: 10
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        notifications_enabled:
          type: boolean
          description: Whether this user receives notifications.
    PatchedAdminUserRequest:
      type: object
      properties:
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          nullable: true
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          nullable: true
          title: Phone number
          maxLength: 32
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
    PatchedMeProfileUpdateRequest:
      type: object
      properties:
        bio:
          type: string
        is_public:
          type: boolean
          title: Public
          description: Whether this profile is visible to other users.
    PatchedMeSettingUpdateRequest:
      type: object
      properties:
        language:
          type: string
          minLength: 1
          maxLength: 10
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        notifications_enabled:
          type: boolean
          description: Whether this user receives notifications.
    PatchedMeUserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
    PublicProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bio:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
      required:
      - bio
      - id
      - user
    PublicUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
      required:
      - id
      - username
    StatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - finalized
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `finalized` - Finalized
  securitySchemes:
    basicAuth:
