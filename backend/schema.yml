        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminGroup'
    PaginatedAdminLogEntryList:
      type: object
      required:
      - count
