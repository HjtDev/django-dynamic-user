openapi: 3.0.3
info:
  title: django-dynamic-user
  version: 0.0.0
paths:
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: Paginated, filterable list of every user. USER_READ_FIELDS-shaped
        full fields except password. Beyond page/page_size, any concrete, non-relation
        field on the resolved user model is accepted as an exact-match query filter
        (?field=value) — see _filterable_user_fields(). That set is host-dependent
        (a subclassed User model adds its own fields), so it cannot be enumerated
        as fixed OpenAPI parameters here; the frontend SDK's AdminUsersParams type
        is intentionally open-ended for the same reason.
      summary: List users (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: Every real field except password.
      summary: Retrieve a user (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: Any user field except password. 403 (whole request rejected) if
        a non-superuser's body touches is_staff/is_superuser/is_active/groups/user_permissions.
      summary: Update a user (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/profile/:
    get:
      operationId: admin_users_profile_retrieve
      description: Every real field on the resolved Profile model.
      summary: Retrieve a user's profile (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
    patch:
      operationId: admin_users_profile_partial_update
      description: Any Profile field, applied via ProfileService.update.
      summary: Update a user's profile (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
  /api/v1/admin/users/{id}/setting/:
    get:
      operationId: admin_users_setting_retrieve
      description: Every real field on the resolved Setting model.
      summary: Retrieve a user's setting (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
          description: ''
    patch:
      operationId: admin_users_setting_partial_update
      description: Any Setting field, applied via SettingService.update.
      summary: Update a user's setting (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminSettingRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
          description: ''
  /api/v1/admin/users/deletion-requests/:
    get:
      operationId: admin_users_deletion_requests_list
      description: Paginated, filterable by status.
      summary: List account-deletion requests (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - finalized
          - pending
          - rejected
        description: Filter by status.
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminDeletionRequestList'
          description: ''
  /api/v1/admin/users/deletion-requests/{id}/finalize/:
    post:
      operationId: admin_users_deletion_requests_finalize_create
      description: Bypasses finalize_at. Irreversible. 409 if the request isn't currently
        APPROVED.
      summary: Finalize an account-deletion request early (admin, superuser-only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/deletion-requests/{id}/review/:
    post:
      operationId: admin_users_deletion_requests_review_create
      description: Moves a PENDING request to APPROVED or REJECTED. 409 if not PENDING.
      summary: Review an account-deletion request (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionReviewRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeletionRequest'
          description: ''
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      description: USER_READ_FIELDS, entirely read-only — includes locked fields for
        visibility, none of them writable from here or anywhere else on this surface.
      summary: Get my account info
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeUser'
          description: ''
  /api/v1/users/me/deletion-request/:
    get:
      operationId: users_me_deletion_request_retrieve
      description: The caller's active (pending or approved) request, or 404 if none
        exists.
      summary: Get my current deletion request
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
          description: ''
    post:
      operationId: users_me_deletion_request_create
      description: Starts the grace-period countdown. 409 (not 500) if a request is
        already pending or approved, rather than creating a duplicate.
      summary: Request account deletion
      tags:
      - dynamic-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionRequestCreateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
          description: ''
    delete:
      operationId: users_me_deletion_request_destroy
      description: 409 (not 500) if the caller's request isn't currently pending.
      summary: Cancel my deletion request
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/me/profile/:
    get:
      operationId: users_me_profile_retrieve
      description: PROFILE_EDITABLE_FIELDS + PROFILE_READ_FIELDS (union).
      summary: Get my profile
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfile'
          description: ''
    patch:
      operationId: users_me_profile_partial_update
      description: PROFILE_EDITABLE_FIELDS, applied via ProfileService.update.
      summary: Update my profile
      tags:
      - dynamic-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeProfileUpdateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfile'
          description: ''
  /api/v1/users/me/setting/:
    get:
      operationId: users_me_setting_retrieve
      description: SETTING_EDITABLE_FIELDS + SETTING_READ_FIELDS (union).
      summary: Get my setting
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSetting'
          description: ''
    patch:
      operationId: users_me_setting_partial_update
      description: SETTING_EDITABLE_FIELDS, applied via SettingService.update.
      summary: Update my setting
      tags:
      - dynamic-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeSettingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeSettingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeSettingUpdateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSetting'
          description: ''
  /api/v1/users/profiles/:
    get:
      operationId: users_profiles_list
      description: Paginated, cached list of every profile with is_public=True. PROFILE_PUBLIC_FIELDS
        plus a nested user block from USER_PUBLIC_FIELDS.
      summary: List public profiles
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProfileList'
          description: ''
  /api/v1/users/profiles/{id}/:
    get:
      operationId: users_profiles_retrieve
      description: PROFILE_PUBLIC_FIELDS plus a nested user block from USER_PUBLIC_FIELDS,
        for one profile. {id} is the target user's id, not the Profile row's own pk.
        404 (not 403) when the profile is private and the requester isn't the owner.
      summary: Retrieve a public profile
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - dynamic-user
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
          description: ''
components:
  schemas:
    AdminDeletionRequest:
      type: object
      description: |-
        ``GET /deletion-requests/``, and the response body of the review/finalize actions —
        entirely read-only. Unlike the self-service :class:`DeletionRequestSerializer`, this one
        includes ``user`` and ``reviewed_by`` — an admin reviewing a queue of everyone's requests
        needs to know whose request it is and who already reviewed it; a self-service caller already
        knows both (or, for ``reviewed_by``, was never meant to see it, per this package's own
        rules).
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
          description: Optional reason provided by the user.
        requested_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        finalize_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - finalize_at
      - id
      - reason
      - requested_at
      - reviewed_at
      - reviewed_by
      - status
      - user
    AdminProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        bio:
          type: string
        is_public:
          type: boolean
          title: Public
          description: Whether this profile is visible to other users.
      required:
      - id
      - user
    AdminSetting:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        language:
          type: string
          maxLength: 10
        timezone:
          type: string
          maxLength: 64
        notifications_enabled:
          type: boolean
          description: Whether this user receives notifications.
      required:
      - id
      - user
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        phone:
          type: string
          nullable: true
          title: Phone number
          maxLength: 32
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
      required:
      - date_joined
      - email
      - id
      - username
    DeletionRequest:
      type: object
      description: |-
        ``GET``/``POST`` responses on ``/me/deletion-request/`` — entirely read-only.

        Deliberately excludes ``user`` (redundant — the caller already knows who they are) and
        ``reviewed_by`` — never expose ``reviewed_by`` on any user-facing serializer, per this
        package's own rules and the Phase 5 guide.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
          description: Optional reason provided by the user.
        requested_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finalize_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - finalize_at
      - id
      - reason
      - requested_at
      - reviewed_at
      - status
    DeletionRequestCreateRequest:
      type: object
      description: |-
        ``POST /me/deletion-request/``'s request body — the only field a caller may supply.

        ``AccountDeletionRequest`` isn't swappable (``docs/CONTRACT.md`` §1), and this shape isn't a
        settings-driven allowlist surface, so it's hand-written with an explicit field list rather
        than routed through :func:`build_serializer` — exactly the case this module's own docstring
        and the Phase 5 guide call out.
      properties:
        reason:
          type: string
          description: Optional reason provided by the user.
    DeletionReviewRequest:
      type: object
      description: |-
        ``POST /deletion-requests/{id}/review/``'s request body — the only field a caller may
        supply. Not a ``ModelSerializer``: ``approved`` isn't itself a model field, it's the input to
        ``DeletionService.review()``'s ``approved`` kwarg.
      properties:
        approved:
          type: boolean
      required:
      - approved
    MeProfile:
      type: object
      properties:
        bio:
          type: string
          readOnly: true
        is_public:
          type: boolean
          readOnly: true
          title: Public
          description: Whether this profile is visible to other users.
        id:
          type: integer
          readOnly: true
      required:
      - bio
      - id
      - is_public
    MeSetting:
      type: object
      properties:
        language:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        notifications_enabled:
          type: boolean
          readOnly: true
          description: Whether this user receives notifications.
        id:
          type: integer
          readOnly: true
      required:
      - id
      - language
      - notifications_enabled
      - timezone
    MeUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        phone:
          type: string
          readOnly: true
          nullable: true
          title: Phone number
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - is_active
      - name
      - phone
      - username
    PaginatedAdminDeletionRequestList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminDeletionRequest'
    PaginatedAdminUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    PaginatedPublicProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicProfile'
    PatchedAdminProfileRequest:
      type: object
      properties:
        bio:
          type: string
        is_public:
          type: boolean
          title: Public
          description: Whether this profile is visible to other users.
    PatchedAdminSettingRequest:
      type: object
      properties:
        language:
          type: string
          minLength: 1
          maxLength: 10
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        notifications_enabled:
          type: boolean
          description: Whether this user receives notifications.
    PatchedAdminUserRequest:
      type: object
      properties:
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          minLength: 1
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        phone:
          type: string
          nullable: true
          title: Phone number
          maxLength: 32
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
    PatchedMeProfileUpdateRequest:
      type: object
      properties:
        bio:
          type: string
        is_public:
          type: boolean
          title: Public
          description: Whether this profile is visible to other users.
    PatchedMeSettingUpdateRequest:
      type: object
      properties:
        language:
          type: string
          minLength: 1
          maxLength: 10
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        notifications_enabled:
          type: boolean
          description: Whether this user receives notifications.
    PublicProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bio:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
      required:
      - bio
      - id
      - user
    PublicUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
      required:
      - id
      - username
    StatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - finalized
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `finalized` - Finalized
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
